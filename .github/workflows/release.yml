# Tags and releases on every PR merge into main from a release/* or hotfix/*
# branch. Runs the full release sequence in order:
#   1. resolve the version (release/* -> from the branch name; hotfix/* ->
#      latest v* tag + patch; a malformed release name fails the job)
#   2. tag the merge commit vX.Y.Z (pure SemVer, no sprint suffix)
#   3. publish the GitHub Release with generated notes from the previous tag
#   4. bump package.json version on main and commit it
#   5. back-merge main -> development (--no-ff; on conflict abort, push a
#      sync/ branch and open a PR, never force-push)
#   6. delete the release/hotfix branch
#   7. (separate job) dispatch the Pages deploy against main
#
# Only fires for release/* and hotfix/* head branches — a feature PR merged
# straight into main does NOT trigger a release (the `if:` guard below).
#
# Auth: this job's default GITHUB_TOKEN pushes the version-bump commit, the
# tag and the back-merge straight to main / development. If those branches
# are later protected, the token must be in the ruleset bypass list.
#
# One case this job CANNOT complete on its own: if the release changed a file
# under .github/workflows/, the back-merge commit updates one and GitHub
# rejects a GITHUB_TOKEN push that touches a workflow file. `workflows` is not
# a valid GITHUB_TOKEN permission key, so it cannot be granted here — finish
# such a release by hand, or with a PAT carrying the `workflow` scope.
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write        # create tags + GitHub Releases, push bump + back-merge
  pull-requests: write   # open the sync-back PR on conflict
  actions: write         # dispatch the Pages deploy workflow

jobs:
  release:
    name: Tag, release, sync main -> development, cleanup
    runs-on: ubuntu-latest
    # Only real merges from a release/* or hotfix/* branch, never a closed
    # PR or a feature PR sneaking into main.
    if: >-
      github.event.pull_request.merged == true
      && (
        startsWith(github.event.pull_request.head.ref, 'release/')
        || startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    steps:
      - name: Checkout merge commit (full history + tags)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Previous release on both paths: the most recent stable v* tag
          # reachable from the merge commit. Passed to `gh release create
          # --notes-start-tag` so the notes start from there.
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"

          case "${HEAD_REF}" in
            release/*)
              # The branch name IS the source of truth. The ONLY accepted form
              # is release/sprint-<X.Y.Z> (no leading v). A malformed name
              # fails loudly — the way to change a release's version is to
              # rename or re-cut the branch, not to relabel a PR.
              if ! [[ "${HEAD_REF}" =~ ^release/sprint-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                echo "::error::Release branch '${HEAD_REF}' is not 'release/sprint-<X.Y.Z>' (no leading 'v' in the version). The branch name is the source of truth; rename or re-cut the branch."
                exit 1
              fi
              next="v${BASH_REMATCH[1]}"
              # Display-only bump kind (does NOT drive `next` — the branch name does).
              if [ -z "${prev}" ]; then
                level="initial"
              else
                pv="${prev#v}"; nv="${next#v}"
                pmj="${pv%%.*}"; rest="${pv#*.}"; pmn="${rest%%.*}"
                nmj="${nv%%.*}"; rest="${nv#*.}"; nmn="${rest%%.*}"
                if   [ "${nmj}" -gt "${pmj}" ]; then level="major"
                elif [ "${nmn}" -gt "${pmn}" ]; then level="minor"
                else                                 level="patch"
                fi
              fi
              ;;
            hotfix/*)
              # A hotfix is an emergency patch for a critical production bug.
              # Always patch-bump the latest tag. A hotfix cannot precede the
              # first release, so a missing prev tag is an error.
              level="patch"
              if [ -z "${prev}" ]; then
                echo "::error::hotfix/* merged but no release tag exists yet — a hotfix cannot precede the first release."
                exit 1
              fi
              export PREV="${prev}"
              # shellcheck disable=SC2016  # $-refs below are JS template literals, not shell
              next="$(node -e '
                const m = process.env.PREV.match(/^v(\d+)\.(\d+)\.(\d+)$/);
                if (!m) { console.error("unparseable prev tag:", process.env.PREV); process.exit(2); }
                let [maj, min, pat] = [+m[1], +m[2], +m[3]];
                pat++;
                process.stdout.write(`v${maj}.${min}.${pat}`);
              ')"
              ;;
            *)
              echo "::error::Unexpected head ref ${HEAD_REF} (expected release/* or hotfix/*)."
              exit 1
              ;;
          esac

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "level=${level}" >> "$GITHUB_OUTPUT"

      - name: Print resolved versions
        env:
          PREV: ${{ steps.version.outputs.prev }}
          NEXT: ${{ steps.version.outputs.next }}
          LEVEL: ${{ steps.version.outputs.level }}
        run: |
          echo "bump level : ${LEVEL}"
          echo "previous   : ${PREV:-<none — first release>}"
          echo "next       : ${NEXT}"

      - name: Tag the merge commit
        env:
          NEXT: ${{ steps.version.outputs.next }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::Tag ${NEXT} already exists; not overwriting. Resolve before re-running."
            exit 1
          fi
          git tag -a "${NEXT}" -m "Release ${NEXT}" "${MERGE_SHA}"
          git push origin "${NEXT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.version.outputs.prev }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # The tag already exists on the exact merge commit, so `gh release
          # create` just attaches the release to it. --generate-notes derives
          # the body from PR titles / commits since the previous tag (or all
          # history on the first release).
          if [ -n "${PREV}" ]; then
            gh release create "${NEXT}" --title "${NEXT}" \
              --generate-notes --notes-start-tag "${PREV}"
          else
            gh release create "${NEXT}" --title "${NEXT}" \
              --generate-notes
          fi

      - name: Bump package.json version on main
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # Strip the leading 'v' — package.json version is bare SemVer.
          NEXT_NO_V="${NEXT#v}"
          # The previous steps ran on a detached merge_commit_sha; move to main.
          git checkout -B main origin/main
          # yarn 1's `version` writes package.json (no git tag, no commit — we
          # make the commit ourselves). Unlike `npm version` it hard-errors when
          # the target equals the current version even under
          # --no-git-tag-version, and that would abort the whole release under
          # `set -e`. So skip the call entirely when package.json is already at
          # NEXT_NO_V — a re-run, or a release whose version already matches
          # (e.g. the very first release if package.json was pre-set to 0.1.0).
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "${CURRENT}" != "${NEXT_NO_V}" ]; then
            yarn version --new-version "${NEXT_NO_V}" --no-git-tag-version
          fi
          # Only commit + push when package.json actually changed — otherwise
          # `git commit` exits 1 under `set -e` and aborts the release (no
          # back-merge, no branch cleanup, no Pages deploy).
          if git diff --quiet -- package.json; then
            echo "::notice::package.json already at ${NEXT_NO_V} — nothing to commit"
          else
            git add package.json
            git commit -m "chore: bump version to ${NEXT_NO_V}"
            git push origin main
          fi

      - name: Back-merge main into development
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git fetch origin development
          git checkout -B development origin/development
          # --no-ff keeps the sync commit explicit rather than a fast-forward
          # that would hide that main moved.
          if git merge --no-ff origin/main -m "chore: sync main into development after ${NEXT}"; then
            git push origin development
            echo "synced=pushed" >> "$GITHUB_OUTPUT"
          else
            # Conflict -> never force-push. Abort, push a sync branch, open a
            # PR for a human to resolve.
            git merge --abort
            sync_branch="sync/main-to-dev-${NEXT}"
            git checkout -B "${sync_branch}" origin/main
            git push -u origin "${sync_branch}"
            body=$(cat <<EOF
          Auto-opened by release.yml — the back-merge of main into development
          after ${NEXT} conflicted and needs a human to resolve, so the next
          sprint carries the release's QA fixes.
          EOF
          )
            url=$(gh pr create --base development --head "${sync_branch}" \
              --title "chore: sync main into development after ${NEXT}" \
              --body "${body}")
            echo "synced=${url}" >> "$GITHUB_OUTPUT"
            echo "::warning::Back-merge conflicted; opened PR for resolution: ${url}"
          fi

      - name: Delete the release/hotfix branch
        # Acting on the PR's head ref, gated by the job-level release/* /
        # hotfix/* check, so main / development can never be targeted here.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git push origin --delete "${HEAD_REF}"
          echo "::notice::Deleted branch ${HEAD_REF}"

      - name: Job summary
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PREV: ${{ steps.version.outputs.prev }}
          LEVEL: ${{ steps.version.outputs.level }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SYNCED: ${{ steps.sync.outputs.synced }}
        run: |
          {
            echo "## Release ${NEXT}"
            echo ""
            echo "- merged: \`${HEAD_REF}\` -> main"
            echo "- bump   : ${LEVEL} (from ${PREV:-<none>})"
            echo "- tag    : ${NEXT}"
            echo "- release: https://github.com/${{ github.repository }}/releases/tag/${NEXT}"
            case "${SYNCED}" in
              pushed) echo "- sync   : main -> development (pushed)" ;;
              *)      echo "- sync   : back-merge PR opened — ${SYNCED}" ;;
            esac
            echo "- cleanup: deleted \`${HEAD_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The version bump above is pushed by GITHUB_TOKEN, and a GITHUB_TOKEN push
  # emits no workflow runs, so deploy-pages.yml's `push` trigger never sees
  # that commit. This job is what tells it — and it DISPATCHES rather than
  # calling deploy-pages.yml as a reusable workflow: a called workflow runs in
  # this workflow's `pull_request` context, so `github.ref` would stay
  # `refs/pull/<n>/merge`, which the `github-pages` environment refuses. A
  # dispatch creates its own run at `refs/heads/main`. `workflow_dispatch` is
  # also the documented exception to "GITHUB_TOKEN pushes trigger nothing".
  publish-pages:
    name: Publish the app to GitHub Pages
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Pages deploy against main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy to GitHub Pages" --ref main --repo "${{ github.repository }}"
          echo "::notice::Dispatched 'Deploy to GitHub Pages' on main."
